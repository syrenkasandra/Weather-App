<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Weather Application</title>

    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kameron:wght@400..700&family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <form id="city-form">
          <input
            type="text"
            placeholder="Enter a city"
            class="city-input"
            id="city-input"
          />
          <input type="submit" value="Search" class="search-button" />
        </form>
        <hr />
      </header>
      <main>
        <div class="city-details">
          <section class="city">
            <h1>Warsaw</h1>
            <p>
              <span id="date"></span>, cloudy
              <br />
              Humidity: <strong id="humidity">78%</strong>, Wind:
              <strong id="wind-speed">12km/h</strong>
            </p>
          </section>
          <div class="temperature">
            <h2>
              <span class="material-symbols-outlined"> cloud </span
              ><span class="current-temperature" id="current-temperature"
                >15</span
              ><span class="celsius-symbol">°C</span>
            </h2>
          </div>
        </div>
      </main>
      <footer>
        <hr />
        <p>
          This project was coded by <a href="">Kasandra Pasich</a> and is
          <a href="https://github.com/syrenkasandra/Weather-App"
            >open-sourced on GitHub</a
          >
          and
          <a href="">hosted on Netlify.</a>
        </p>
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
